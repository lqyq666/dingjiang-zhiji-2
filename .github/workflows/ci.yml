name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/ml-service --all-extras --locked
      - run: pnpm control-plane:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check full repository formatting on main
        if: github.ref == 'refs/heads/main'
        run: pnpm format:check
      - name: Check changed file formatting on task branches and pull requests
        if: github.ref != 'refs/heads/main'
        env:
          FORMAT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check:changed
      - run: docker compose config

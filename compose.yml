name: dingjiang-chonggou-v1

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: dingjiang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
      POSTGRES_USER: dingjiang
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dingjiang -d dingjiang"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

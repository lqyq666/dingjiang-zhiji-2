services:
  api:
    ports:
      - "127.0.0.1:${DJ_WORKBUDDY_API_PORT:-3001}:3001"
    environment:
      FEISHU_PROVIDER_MODE: ${FEISHU_PROVIDER_MODE:-DEMO_RULES}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BASE_APP_TOKEN: ${FEISHU_BASE_APP_TOKEN:-}
      FEISHU_REVIEW_TABLE_ID: ${FEISHU_REVIEW_TABLE_ID:-}
      FEISHU_APPROVER_OPEN_ID: ${FEISHU_APPROVER_OPEN_ID:-}
